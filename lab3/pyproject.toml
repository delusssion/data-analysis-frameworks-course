[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-detection-lab3"
version = "0.1.0"
description = "Лабораторная работа №3: извлечение разметки из видео и обучение детектора объектов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pillow>=10.4",
    "scipy>=1.14",
    "torch>=2.3",
    "torchvision>=0.18",
    "torchmetrics>=1.4",
    "pycocotools>=2.0.7",
    "tqdm>=4.66",
    "gdown>=5.2",
]

[tool.setuptools]
py-modules = []
